[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedc2"
version = "0.1.0"
description = "Minimal reference implementation of FedC2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["fedc2*"]

